  <path d="M345 588 Q400 628 455 588" stroke="#232323" stroke-width="10" fill="none" stroke-linecap="round"/>

  <text x="400" y="170" text-anchor="middle" font-family="Archivo, sans-serif" font-size="34" font-weight="700" fill="#2a1a12">BUSINESS MODE</text>
