<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-labelledby="title desc">
  <title id="title">Business Coach placeholder</title>
  <desc id="desc">Calm placeholder portrait for business mode.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f6f3ef"/>
      <stop offset="100%" stop-color="#e8dfd5"/>
    </linearGradient>
    <linearGradient id="blazer" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2d3f56"/>
      <stop offset="100%" stop-color="#1f2a3b"/>
